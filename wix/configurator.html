<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NBDesign Sign Configurator</title>
<!-- Paste this whole file into a Wix "Embed HTML" element (Code mode). Prices come from backend/nbd-pricing.js. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,800;1,900&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#EFEFED; --panel:#FFFFFF; --ink:#0A0A0A; --muted:#55565A; --line:#D3D2CE; --steel:#B5B4B0; --peach:#F0BB9B; --mag:#C8195F; --ok:#1E7F4F; --board:#FAFAF8;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body{padding:16px}
h1,h2{font-family:var(--f-display);font-style:italic;font-weight:900;margin:0;line-height:1.02;text-wrap:balance}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.82rem;color:var(--muted)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

.backbtn{display:inline-flex;align-items:center;gap:10px;margin:18px 0 4px;padding:10px 18px 10px 14px;border:2px solid var(--ink);background:var(--panel,#fff);color:var(--ink);text-decoration:none;font-family:var(--f-display);font-style:italic;font-weight:800;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;box-shadow:4px 4px 0 var(--peach,#F0BB9B);cursor:pointer}
.backbtn:hover,.backbtn:focus-visible{background:var(--peach,#F0BB9B)}
.backbtn .arr{font-size:1.3rem;line-height:1;font-style:normal}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:16px;border-bottom:6px solid var(--ink);box-shadow:0 5px 0 var(--peach)}
.tab{flex:none;border:2px solid var(--ink);background:var(--panel);padding:7px 14px;cursor:pointer;font-family:var(--f-display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:1rem;letter-spacing:.02em;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--panel)}

.pgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.pgrid{grid-template-columns:1fr}}
.proof{position:sticky;top:0;background:var(--panel);border:1px solid var(--line);padding:16px}
@media (max-width:820px){.proof{position:static}}
.stage{height:320px;display:grid;place-items:center;position:relative;overflow:hidden;background:
  linear-gradient(var(--line) 1px,transparent 1px) 0 0/20px 20px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/20px 20px,var(--paper)}
.signbox{position:relative;transition:width .25s,height .25s}
.sign{position:absolute;inset:0;background:var(--board);border:1px solid var(--ink);box-shadow:0 6px 18px rgba(0,0,0,.12);display:grid;place-items:center;overflow:hidden}
.sign.flag{border-radius:0 100% 0 0 / 0 22% 0 0}
.sign.mediawall{background:radial-gradient(ellipse 7px 4px,var(--steel) 98%,transparent) 0 0/32px 24px,radial-gradient(ellipse 7px 4px,var(--steel) 98%,transparent) 16px 12px/32px 24px,var(--board)}
.sign.mediawall span{background:var(--board);padding:4px 8px}
.eyes{position:absolute;inset:0;pointer-events:none;z-index:2}
.eye{position:absolute;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 50% 50%,var(--paper) 0 34%,#8A8B8F 36% 52%,#D9DADD 56% 70%,#6E6F73 74% 100%);box-shadow:0 1px 2px rgba(0,0,0,.35);transition:opacity .2s}
.sign span{font-family:var(--f-display);font-style:italic;font-weight:900;text-transform:uppercase;color:var(--muted);font-size:clamp(.75rem,2vw,1.3rem);text-align:center;padding:4px;line-height:1;word-break:normal;overflow-wrap:normal}
.crop{position:absolute;width:12px;height:12px;border:0 solid var(--mag)}
.crop.tl{top:-16px;left:-16px;border-right-width:1px;border-bottom-width:1px}
.crop.tr{top:-16px;right:-16px;border-left-width:1px;border-bottom-width:1px}
.crop.bl{bottom:-16px;left:-16px;border-right-width:1px;border-top-width:1px}
.crop.br{bottom:-16px;right:-16px;border-left-width:1px;border-top-width:1px}
.dim{position:absolute;font-family:var(--f-mono);font-size:.75rem;white-space:nowrap}
.dim.w{left:0;right:0;top:-26px;text-align:center;border-bottom:1px solid var(--ink);line-height:1.6}
.dim.h{top:0;bottom:0;right:-30px;writing-mode:vertical-rl;text-align:center;border-left:1px solid var(--ink)}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:.85rem;color:var(--muted)}

.cfg{display:flex;flex-direction:column;gap:18px}
.cfg h1{font-size:clamp(2rem,5vw,2.9rem)}
.blurb{color:var(--muted);margin:4px 0 0}
.group{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--panel);padding:8px 12px;cursor:pointer;font-weight:500;font-size:.93rem;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;text-align:left}
.chip small{color:var(--muted);font-size:.78rem}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--panel);box-shadow:inset 0 -4px 0 var(--peach)}
.chip[aria-pressed="true"] small{color:var(--peach)}
.size-group .label{color:var(--ink)}
.chip[data-size] small,.chip[data-preset] small{color:var(--ink)}
.chip[data-size][aria-pressed="true"],.chip[data-preset][aria-pressed="true"]{background:var(--peach);color:#0A0A0A;border-color:#0A0A0A;box-shadow:inset 0 0 0 1px #0A0A0A}
.chip[data-size][aria-pressed="true"] small,.chip[data-preset][aria-pressed="true"] small{color:#0A0A0A}

.wh{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.82rem;color:var(--muted)}
input[type=number]{background:var(--panel);border:1.5px solid var(--line);padding:9px 10px;width:100%}
input:focus{border-color:var(--ink);outline:none}
.x{padding-bottom:10px;color:var(--muted)}
.oi{display:inline-block;border:2px solid currentColor;vertical-align:-2px;margin-right:8px}
.oi.land{width:18px;height:12px}.oi.port{width:12px;height:18px}
.chip.orient{flex-direction:row;align-items:center}
.catbox{display:flex;flex-direction:column;gap:10px;border:1.5px dashed var(--line);padding:12px}
.catpick{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center}
.catsvg{display:block;width:100%;height:auto;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.catpick a{color:var(--ink)}
.field input[type=text]{background:var(--panel);border:1.5px solid var(--line);padding:9px 10px;width:100%}
.sign{background-size:100% 100%;background-repeat:no-repeat;background-position:center}
.sizelink{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border:1.5px dashed var(--ink);color:var(--ink);text-decoration:none;font-size:.93rem}
.sizelink:hover{background:var(--peach);border-style:solid}
.sizelink strong{font-weight:600}
.hint a{color:var(--ink);font-weight:600}
.hint{font-size:.84rem;color:var(--muted)}
.err{font-size:.86rem;color:var(--mag)}
.qtyrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stepper{display:flex;border:1.5px solid var(--line)}
.stepper button{border:0;background:var(--paper);width:40px;cursor:pointer;font-size:1.2rem}
.stepper input{border:0;width:70px;text-align:center}
.tiers{display:flex;gap:4px;flex-wrap:wrap}
.tier{font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);padding:2px 6px;color:var(--muted)}
.tier.on{border-color:var(--ok);color:var(--ok);font-weight:500}
.binbtn{display:inline-grid;place-items:center;width:38px;height:38px;flex:none;border:1.5px solid var(--ink);background:var(--panel,#fff);color:var(--ink);border-radius:2px;cursor:pointer;padding:0}
.binbtn:hover,.binbtn:focus-visible{background:var(--peach,#F0BB9B)}
.binbtn[hidden]{display:none}
.filenote .binbtn{vertical-align:middle;margin-left:8px;width:32px;height:32px}
.filenote{border:1.5px dashed var(--line);padding:10px 12px;font-size:.88rem}

.approve{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--peach);padding:12px;margin:8px 0 4px;cursor:pointer;background:rgba(240,187,155,.08)}
.approve input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:#F0BB9B}
.approve span{font-size:.88rem;line-height:1.4}
.approve.ok{background:var(--peach);color:#0A0A0A}
.total{background:var(--ink);color:var(--panel);padding:18px;display:flex;flex-direction:column;gap:6px;box-shadow:6px 6px 0 var(--peach)}
.row{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;opacity:.85}
.big{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid rgba(255,255,255,.3);padding-top:10px;margin-top:4px}
.big .mono{font-size:1.9rem}
.btn{background:var(--panel);color:var(--ink);border:0;padding:13px 26px;font-family:var(--f-display);font-style:italic;font-weight:900;font-size:1.25rem;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;margin-top:8px;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.btn:hover{background:var(--peach)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.alt{background:var(--peach)}
.status{font-size:.9rem;min-height:1.4em}
.status.bad{color:#FF8FB5}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="loading">Loading prices…</div></div>
<script>
let C = null, P = null, cfg = null, fileName = '', addedOnce = false;
const $ = (s) => document.querySelector(s);
const money = (n) => '$' + n.toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const send = (msg) => window.parent.postMessage(msg, '*');

// Same rules as backend/nbd-pricing.js unitPrice(). The cart always uses the backend version.
function curveRate(c, A) {
  // Price per m2 for a total order area A (m2): straight lines on a log-log scale between the curve's points,
  // continued past the ends, never below the floor.
  const p = c.points, L = Math.log; let i = 0;
  if (A >= p[p.length - 1][0]) i = p.length - 2; else while (i < p.length - 2 && A > p[i + 1][0]) i++;
  const [a1, r1] = p[i], [a2, r2] = p[i + 1], b = (L(r2) - L(r1)) / (L(a2) - L(a1));
  return Math.max(c.floor || 0, r1 * Math.exp(b * (L(Math.max(A, 0.01)) - L(a1))));
}
// Per-sign price at a few quantities for the chosen size and options (volume-priced products)
function volumeHtml() {
  const BR = [5, 10, 20, 50, 100], keep = cfg.qty;
  const out = BR.map((n, i) => { cfg.qty = n; const r = quote(); return `<span class="tier ${keep >= n && (i === BR.length - 1 || keep < BR[i + 1]) ? 'on' : ''}">${n}+ ${money(r.each)} ea</span>`; });
  cfg.qty = keep;
  return out.join('') + (C.orderMin ? `<span class="hint" style="flex-basis:100%">Minimum order ${money(C.orderMin)}.</span>` : '');
}
function discountFor(q, tiers) { let d = 0; for (const [t, v] of (tiers || C.tiers)) if (q >= t) d = v; return d; }
// Products with their own quantity steps show the price each at every step
function stepHtml() {
  const keep = cfg.qty, T = P.tiers;
  const out = T.map(([n], i) => { cfg.qty = n; const r = quote(); return `<span class="tier ${keep >= n && (i === T.length - 1 || keep < T[i + 1][0]) ? 'on' : ''}">${n}+ ${money(r.each)} ea</span>`; });
  cfg.qty = keep;
  return out.join('');
}
function quote() {
  const q0 = Math.max(1, cfg.qty | 0);
  const area0 = cfg.w * cfg.h / 1e6;
  let unit = P.mode === 'fixed' ? P.sizes[cfg.size].p : P.curve ? curveRate(P.curve, area0 * q0) * area0 : area0 * P.rate, adds = 0;
  for (const o of P.options) { const ch = o.choices[cfg.opts[o.id] || 0]; if (ch.m) unit *= ch.m; if (ch.a) adds += ch.a; }
  const base = unit * (P.noMarkup ? 1 : (C.markup || 1));
  unit = Math.max(0, base + adds);
  const qty = Math.max(1, cfg.qty | 0), disc = P.noBulk ? 0 : P.tiers ? (unit ? base * discountFor(qty, P.tiers) / unit : 0) : discountFor(qty), sp = (C.speed.find((s) => s.id === cfg.speed) || C.speed[0]).m;
  const r2 = (n) => Math.round(n * 100) / 100;
  let net = unit * (1 - disc);
  const minUp = false; // the $120 minimum is per order (cart), not per item
  const each = r2(net * sp);
  const fee = cfg.art === 'design' ? C.designFee : 0;
  const total = r2(each * qty + fee), gross = r2(unit * qty);
  // Split the difference between list price and what Wix charges into discount / express rows that add up exactly
  let discAmt, express = 0;
  if (sp > 1) { discAmt = r2((unit - net) * qty); express = r2(total - fee - gross + discAmt); }
  else discAmt = r2(gross + fee - total); // may be a cent negative from rounding up
  return { list: unit, gross, qty, disc, discAmt, express, each, fee, total, minUp };
}

// Width/height the right way round for the chosen orientation
function od(w, h) { return P.rotate && cfg.orient === 'port' ? [Math.min(w, h), Math.max(w, h)] : [Math.max(w, h), Math.min(w, h)]; }
const same = (a, b) => [a[0], a[1]].sort((x, y) => x - y).join('x') === [b[0], b[1]].sort((x, y) => x - y).join('x');
// Eyelets around all edges, about every `gap` mm, always including the corners
function edgeEyes(bw,bh,m,wmm,hmm,gap){
  const nx=Math.max(1,Math.ceil(wmm/gap)), ny=Math.max(1,Math.ceil(hmm/gap)), pts=[];
  for(let i=0;i<=nx;i++){const x=m+(bw-2*m)*i/nx; pts.push([x,m],[x,bh-m]);}
  for(let j=1;j<ny;j++){const y=m+(bh-2*m)*j/ny; pts.push([m,y],[bw-m,y]);}
  return pts;
}
// Draws a catalogue design as an SVG at the sign's real proportions (W x H in mm)
function signSVG(d, W, H, T) {
  const t = T[d.type] || T.info, m = Math.min(W, H);
  const hb = Math.min(H * 0.32, W * 0.42), pad = m * 0.07, fr = m * 0.014;
  const head = d.head || t.head || '';
  const X = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const txt = (s, x, y, fs, col) => `<text x="${x}" y="${y}" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="${fs.toFixed(2)}" fill="${col}" text-anchor="middle" dominant-baseline="central">${X(s)}</text>`;
  // approximate width of bold Arial capitals, in ems
  const em = (s) => [...String(s)].reduce((w, c) => w + (c === ' ' ? 0.28 : '.,:I1J'.includes(c) ? 0.32 : 'MW'.includes(c) ? 0.86 : c === '→' ? 1 : 0.68), 0) || 1;
  const fit = (s, maxW, maxH) => Math.min(maxH, maxW / em(s));
  let g = `<rect width="${W}" height="${H}" fill="${t.bg}"/><rect x="0" y="0" width="${W}" height="${hb}" fill="${t.band}"/>`;
  if (t.oval) {
    const rx = Math.min(W * 0.4, hb * 1.9), ry = hb * 0.36;
    g += `<ellipse cx="${W / 2}" cy="${hb / 2}" rx="${rx}" ry="${ry}" fill="${t.oval}"/>` + txt(head, W / 2, hb / 2, fit(head, rx * 1.45, ry * 1.15), t.headCol);
  } else if (head) {
    g += txt(head, W / 2, hb / 2, fit(head, W - 2 * pad, hb * 0.58), t.headCol);
  }
  if (t.rule) g += `<rect x="${pad}" y="${hb - m * 0.012}" width="${W - 2 * pad}" height="${m * 0.024}" fill="${t.text}"/>`;
  const top = hb + pad * 0.7, bodyH = H - hb - pad * 1.7, maxW = W - 2 * pad;
  // wrap long lines while there is spare height (portrait signs, long notices)
  let lines = [...(d.lines || [])];
  for (let k = 0; k < 8; k++) {
    const wide = Math.max(...lines.map(em)), fsW = maxW / wide, fsH = bodyH / (lines.length * 1.2);
    const i = lines.findIndex((l) => em(l) === wide);
    if (fsH < fsW * 1.7 || !lines[i].includes(' ')) break;
    const words = lines[i].split(' '); let best = 1, diff = 1e9;
    for (let j = 1; j < words.length; j++) { const dd = Math.abs(em(words.slice(0, j).join(' ')) - em(words.slice(j).join(' '))); if (dd < diff) { diff = dd; best = j; } }
    lines.splice(i, 1, words.slice(0, best).join(' '), words.slice(best).join(' '));
  }
  const n = Math.max(1, lines.length);
  const fs = Math.min(bodyH / (n * 1.2), maxW / Math.max(...lines.map(em)), hb * 0.55), lh = fs * 1.2;
  lines.forEach((l, i) => { g += txt(l, W / 2, top + (bodyH - lh * n) / 2 + lh * (i + 0.5), fs, t.text); });
  g += `<rect x="${fr / 2}" y="${fr / 2}" width="${W - fr}" height="${H - fr}" fill="none" stroke="${t.frame}" stroke-width="${fr}"/>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${g}</svg>`;
}
const signDataURL = (d, W, H, T) => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(signSVG(d, W, H, T));

const catFor = (code) => (C.catalogue || []).find((d) => d.code === code);
const catThumb = (d, W, H) => signSVG(d, W, H, C.signTypes).replace(`width="${W}" height="${H}"`, 'class="catsvg"');
let startDesign = '', startSize = null;
function selectProduct(id) {
  P = C.products.find((p) => p.id === id) || C.products[0];
  const first = P.mode === 'fixed' ? P.sizes[0] : { w: (P.presets[1] || P.presets[0])[0], h: (P.presets[1] || P.presets[0])[1] };
  cfg = { product: P.id, w: first.w, h: first.h, size: 0, orient: P.port ? 'port' : 'land', opts: {}, qty: 1, speed: 'std', art: cfg ? cfg.art : 'upload', design: '', note: '' };
  if (P.port) [cfg.w, cfg.h] = od(cfg.w, cfg.h);
  if (cfg.art === 'catalogue' && !P.catalogue) cfg.art = 'upload';
  if (startDesign && P.catalogue && catFor(startDesign)) { cfg.art = 'catalogue'; cfg.design = startDesign; }
  startDesign = '';
  if (startSize) { // size chosen in the AI artwork helper; only accepted if it's one of this product's sizes
    const sw = +startSize.w, sh = +startSize.h, port = startSize.orient === 'port';
    const fits = (w, h) => (w === sw && h === sh) || (P.rotate && w === sh && h === sw);
    if (P.mode === 'fixed') { const i = P.sizes.findIndex((z) => fits(z.w, z.h)); if (i >= 0) { cfg.size = i; cfg.w = P.sizes[i].w; cfg.h = P.sizes[i].h; } }
    else { const pr = P.presets.find(([w, h]) => fits(w, h)); if (pr) { cfg.w = pr[0]; cfg.h = pr[1]; } }
    if (P.rotate) { cfg.orient = port ? 'port' : 'land'; [cfg.w, cfg.h] = od(cfg.w, cfg.h); }
    startSize = null;
  }
  render();
  send({ type: 'art', art: cfg.art });
}

function render() {
  const tabs = C.products.map((p) => `<button class="tab" role="tab" data-p="${p.id}" aria-selected="${p.id === P.id}">${esc(p.name)}</button>`).join('');
  const sizeChips = P.mode === 'fixed'
    ? P.sizes.map((s, i) => { const [sw, sh] = P.rotate ? od(s.w, s.h) : [s.w, s.h]; return `<button class="chip" data-size="${i}" aria-pressed="${cfg.size === i}">${s.n ? `<span>${esc(s.n)}</span><small class="mono">${sw}×${sh}mm · ${money(s.p)}</small>` : `<span class="mono">${sw}×${sh}mm</span><small>${money(s.p)}</small>`}</button>`; }).join('')
    : P.presets.map(([w, h]) => { const [ow, oh] = od(w, h); return `<button class="chip" data-preset="${w}x${h}" aria-pressed="false"><span class="mono">${ow}×${oh}</span></button>`; }).join('');
  const orientHtml = P.rotate ? `<div class="group"><span class="label">Orientation</span><div class="chips">${[['land', 'Landscape'], ['port', 'Portrait']].map(([k, l]) => `<button class="chip orient" data-orient="${k}" aria-pressed="${cfg.orient === k}"><span class="oi ${k}" aria-hidden="true"></span>${l}</button>`).join('')}</div></div>` : '';
  const optHtml = P.options.map((o) => `<div class="group"><span class="label">${esc(o.label)}</span><div class="chips">${o.choices.map((c, i) => `<button class="chip" data-opt="${o.id}" data-i="${i}" aria-pressed="${(cfg.opts[o.id] || 0) === i}">${esc(c.l)}${c.a ? `<small>${c.a > 0 ? '+' : '−'}${money(Math.abs(c.a))} each</small>` : c.m && c.m !== 1 ? `<small>+${Math.round((c.m - 1) * 100)}%</small>` : ''}</button>`).join('')}</div></div>`).join('');
  $('#app').innerHTML = `
  <a class="backbtn" href="${esc(C.shopUrl || '/')}" target="_top"><span class="arr" aria-hidden="true">←</span> All products</a>
  <div class="tabs" role="tablist">${tabs}</div>
  <div class="pgrid">
    <div class="proof">
      <div class="stage" id="stage"><div class="signbox" id="box"><div class="sign ${['flag', 'mediawall'].includes(P.shape) ? P.shape : ''}"><span id="ph"></span></div><div class="eyes" id="eyes"></div>
        <i class="crop tl"></i><i class="crop tr"></i><i class="crop bl"></i><i class="crop br"></i>
        <span class="dim w" id="dw"></span><span class="dim h" id="dh"></span></div></div>
      <div class="meta"><span>Live proof, to scale</span><span class="mono" id="area"></span></div>
    </div>
    <div class="cfg">
      <div><h1>${esc(P.name)}</h1><p class="blurb">${esc(P.blurb)}</p></div>
      ${orientHtml}
      <div class="group size-group"><span class="label">Size</span><div class="chips">${sizeChips}</div>
        <a class="sizelink" href="/custom-size-request" target="_top"><span><strong>Need a different size?</strong> Request a custom size quote</span><span aria-hidden="true">→</span></a>
      </div>
      ${optHtml}
      <div class="group"><span class="label">${esc(P.qtyLabel || 'Quantity')}</span><div class="qtyrow">
        <div class="stepper"><button data-q="-1" aria-label="Fewer">−</button><input id="qty" type="number" min="1" max="1000" value="${cfg.qty}" aria-label="Quantity"><button data-q="1" aria-label="More">+</button></div>
        <div class="tiers" id="tiers"></div></div></div>
      <div class="group"><span class="label">Turnaround</span>${C.speed.length === 1 ? `<div class="hint" style="font-size:.95rem;color:var(--ink)">${esc(C.speed[0].s)} from artwork approval</div>` : `<div class="chips">${C.speed.map((s) => `<button class="chip" data-speed="${s.id}" aria-pressed="${cfg.speed === s.id}">${s.l}<small>${s.s}${s.m > 1 ? ' · +' + Math.round((s.m - 1) * 100) + '%' : ''}</small></button>`).join('')}</div>`}</div>
      <div class="group"><span class="label">Artwork</span><div class="chips">${C.art.filter((a) => a.id !== 'catalogue' || P.catalogue).map((a) => `<button class="chip" data-art="${a.id}" aria-pressed="${cfg.art === a.id}">${esc(a.l)}<small>${a.fee ? '+' + money(a.fee) + ' · ' : ''}${esc(a.s)}</small></button>`).join('')}</div>
        <div class="filenote" id="filenote" ${cfg.art === 'upload' ? '' : 'hidden'}></div>
        <div class="catbox" id="catbox" ${cfg.art === 'catalogue' ? '' : 'hidden'}></div></div>
      <div class="total" aria-live="polite" id="total"></div>
    </div>
  </div>`;
  bind(); update();
}

function bind() {
  document.querySelectorAll('[data-p]').forEach((b) => b.onclick = () => selectProduct(b.dataset.p));
  document.querySelectorAll('[data-size]').forEach((b) => b.onclick = () => { cfg.size = +b.dataset.size; [cfg.w, cfg.h] = P.rotate ? od(P.sizes[cfg.size].w, P.sizes[cfg.size].h) : [P.sizes[cfg.size].w, P.sizes[cfg.size].h]; press('[data-size]', b); update(); });
  document.querySelectorAll('[data-orient]').forEach((b) => b.onclick = () => { cfg.orient = b.dataset.orient; [cfg.w, cfg.h] = od(cfg.w, cfg.h); render(); });
  document.querySelectorAll('[data-preset]').forEach((b) => b.onclick = () => { const [w, h] = b.dataset.preset.split('x').map(Number); [cfg.w, cfg.h] = od(w, h); update(); });
  document.querySelectorAll('[data-opt]').forEach((b) => b.onclick = () => { cfg.opts[b.dataset.opt] = +b.dataset.i; press(`[data-opt="${b.dataset.opt}"]`, b); update(); });
  document.querySelectorAll('.stepper [data-q]').forEach((b) => b.onclick = () => { cfg.qty = Math.min(1000, Math.max(1, cfg.qty + +b.dataset.q)); $('#qty').value = cfg.qty; update(); });
  $('#qty').oninput = (e) => { cfg.qty = Math.min(1000, Math.max(1, parseInt(e.target.value, 10) || 1)); update(); };
  document.querySelectorAll('[data-speed]').forEach((b) => b.onclick = () => { cfg.speed = b.dataset.speed; press('[data-speed]', b); update(); });
  document.querySelectorAll('[data-art]').forEach((b) => b.onclick = () => { cfg.art = b.dataset.art; cfg.approved = false; press('[data-art]', b); $('#filenote').hidden = cfg.art !== 'upload'; $('#catbox').hidden = cfg.art !== 'catalogue'; send({ type: 'art', art: cfg.art }); update(); });
}
function press(sel, on) { document.querySelectorAll(sel).forEach((x) => x.setAttribute('aria-pressed', x === on)); }

function update() {
  let msg = '';
  if (P.mode === 'area') {
    // Only the listed sizes can be ordered online
    if (!P.presets.some((pr) => same(pr, [cfg.w, cfg.h]))) msg = 'Choose one of the sizes above.';
    document.querySelectorAll('[data-preset]').forEach((b) => b.setAttribute('aria-pressed', same(b.dataset.preset.split('x').map(Number), [cfg.w, cfg.h])));
  }
  const st = $('#stage'), box = $('#box');
  const w = Math.max(cfg.w, 1), h = Math.max(cfg.h, 1), s = Math.min((st.clientWidth - 90) / w, (st.clientHeight - 80) / h);
  box.style.width = Math.max(8, w * s) + 'px'; box.style.height = Math.max(8, h * s) + 'px';
  // Eyelets on the proof: any chosen option with 'ey' set ('4' = all corners, 'top' = top corners)
  {const ey=$('#eyes'); let mode='';
   for(const o of P.options){const ch=o.choices[cfg.opts[o.id] || 0]; if(ch&&ch.ey)mode=ch.ey;}
   const bw=parseFloat(box.style.width), bh=parseFloat(box.style.height);
   // drawn to scale: 25mm eyelets, centred 25mm in from the edge (never smaller than 4px so they stay visible)
   const k=bw/Math.max(cfg.w,1), d=Math.max(4,25*k), m=Math.max(d/2+1,25*k);
   const pts=mode==='4'?[[m,m],[bw-m,m],[m,bh-m],[bw-m,bh-m]]:mode==='top'?[[m,m],[bw-m,m]]:mode==='edge'?edgeEyes(bw,bh,m,cfg.w,cfg.h,500):[];
   ey.innerHTML=pts.map(([x,y])=>`<i class="eye" style="left:${x}px;top:${y}px;width:${d}px;height:${d}px"></i>`).join('');}
  $('#dw').textContent = cfg.w + ' mm'; $('#dh').textContent = cfg.h + ' mm';
  const catD = cfg.art === 'catalogue' && cfg.design ? catFor(cfg.design) : null;
  document.querySelector('.sign').style.backgroundImage = catD ? `url("${signDataURL(catD, cfg.w, cfg.h, C.signTypes)}")` : '';
  $('#ph').textContent = catD ? '' : cfg.art === 'design' ? 'We design it' : cfg.art === 'catalogue' ? 'Choose a catalogue design' : (cfg.art === 'upload' && fileName) ? fileName : 'Your artwork';
  const cb = $('#catbox');
  if (cb) {
    cb.innerHTML = catD
      ? `<div class="catpick">${catThumb(catD, cfg.w, cfg.h)}<div><span class="mono">${catD.code}</span><div><strong>${esc(catD.title)}</strong></div><a href="/sign-catalogue?product=${P.id}" target="_top">Change design</a></div></div>
        <div class="field"><label for="catnote">Details to add or change (optional)</label><input id="catnote" type="text" maxlength="200" placeholder="e.g. add 0400 123 456 and our logo" value="${esc(cfg.note || '')}"></div>`
      : `<a class="sizelink" href="/sign-catalogue?product=${P.id}" target="_top"><span><strong>Choose a design</strong> from our free sign catalogue</span><span aria-hidden="true">→</span></a>`;
    const cn = $('#catnote'); if (cn) cn.oninput = (e) => { cfg.note = e.target.value; };
  }
  $('#area').textContent = cfg.w * cfg.h < 1e4 ? `${cfg.w}×${cfg.h} mm` : (cfg.w * cfg.h / 1e6).toFixed(2) + ' m² each';
  $('#filenote').innerHTML = fileName ? `Selected: <strong>${esc(fileName)}</strong>. It uploads when you add to cart.<button type="button" class="binbtn" id="clearFile" aria-label="Remove chosen file" title="Remove file"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>` : 'Choose your file with the <strong>Upload artwork</strong> button below this panel. PDF works best.<br>Made it with Claude, ChatGPT or another AI tool? Upload it as is. We check every file before printing.<br><strong>Tip:</strong> ask your AI tool to "save this as a print-ready PDF at ####mm × ####mm, 300 DPI".';
  const cf = $('#clearFile'); if (cf) cf.onclick = () => { fileName = ''; send({ type: 'clearFile' }); update(); };
  $('#tiers').innerHTML = P.curve ? volumeHtml() : P.tiers ? stepHtml() : P.noBulk ? (C.orderMin ? `<span class="hint">Minimum order ${money(C.orderMin)}.</span>` : '') : C.tiers.slice(1).map(([t, d]) => `<span class="tier ${discountFor(cfg.qty) === d ? 'on' : ''}">${t}+ −${Math.round(d * 100)}%</span>`).join('');
  const r = quote();
  const tu = C.orderMin && r.total < C.orderMin ? Math.round((C.orderMin - r.total) * 100) / 100 : 0;
  $('#total').innerHTML = `
    <div class="row"><span>${r.qty} × ${money(r.list)}</span><span class="mono">${money(r.gross)}</span></div>
    ${Math.abs(r.discAmt) >= 0.01 ? `<div class="row"><span>${r.disc ? (P.tiers ? 'Price for ' + P.tiers.filter(([t]) => r.qty >= t).pop()[0] + '+' : 'Bulk discount ' + Math.round(r.disc * 100) + '%') : 'Rounding'}</span><span class="mono">${r.discAmt > 0 ? '−' : '+'}${money(Math.abs(r.discAmt))}</span></div>` : ''}
    ${r.express ? `<div class="row"><span>Express turnaround</span><span class="mono">+${money(r.express)}</span></div>` : ''}
    ${r.fee ? `<div class="row"><span>Design service</span><span class="mono">+${money(r.fee)}</span></div>` : ''}
    ${tu ? `<div class="row"><span>Minimum order top-up (${money(C.orderMin)} minimum)</span><span class="mono">+${money(tu)}</span></div>` : ''}
    ${C.freight ? `<div class="row"><span>Freight, flat rate</span><span class="mono">+${money(C.freight)}</span></div>` : ''}
    <div class="big"><span class="label" style="color:inherit">Total incl. GST${C.freight ? ' &amp; freight' : ''}</span><span class="mono">${money(r.total + tu + (C.freight || 0))}</span></div>
    <div class="row"><span>${money(r.each)} each · GST ${money((r.total + tu + (C.freight || 0)) / 11)}</span></div>
    ${tu ? `<div class="row" style="opacity:.75"><span>Orders under ${money(C.orderMin)} are topped up to ${money(C.orderMin)}. Add more items and the top-up shrinks or disappears.</span></div>` : ''}
    ${C.freight ? `<div class="row" style="opacity:.75"><span>One ${money(C.freight)} freight charge covers your whole order, however many items. Or choose Free Pick Up, Hume ACT 2620.</span></div>` : ''}
    <label class="approve ${cfg.approved ? 'ok' : ''}"><input type="checkbox" id="approve" ${cfg.approved ? 'checked' : ''}><span>${approvalText()}</span></label>
    <div class="row" style="opacity:.75"><span>Colours on screen can look slightly different once printed.</span></div>
    <button class="btn" id="add" ${msg || !cfg.approved ? 'disabled' : ''}>Add to cart</button>
    ${addedOnce ? '<button class="btn alt" id="viewCart">View cart &amp; checkout</button>' : ''}
    <div class="status" id="status"></div>`;
  $('#approve').onchange = (e) => { cfg.approved = e.target.checked; update(); };
  $('#add').onclick = () => {
    if (!cfg.approved) { status('Please tick the proof approval box first.', true); return; }
    $('#add').disabled = true;
    if (cfg.art === 'catalogue' && !(cfg.design && catFor(cfg.design))) { $('#add').disabled = false; status('Choose a design from the sign catalogue first.', true); return; }
    send({ type: 'add', item: { product: cfg.product, w: cfg.w, h: cfg.h, size: cfg.size, orient: cfg.orient, opts: cfg.opts, qty: cfg.qty, speed: cfg.speed, art: cfg.art, design: cfg.design, note: cfg.note, approved: true } });
  };
  if ($('#viewCart')) $('#viewCart').onclick = () => send({ type: 'cart' });
}

// What the customer agrees to before adding to cart, depending on how the artwork is supplied
function approvalText() {
  if (cfg.art === 'design') return 'I understand NBDesign will email me a proof to approve before anything is printed.';
  if (cfg.art === 'later' || (cfg.art === 'upload' && !fileName)) return "I'll email my artwork. I understand it will be printed exactly as supplied, so I'll check spelling, wording, colours and layout before sending it.";
  return 'I approve this proof as shown. I have checked the spelling, wording, phone numbers, colours, size and layout, and I understand it will be printed exactly as supplied. NBDesign is not responsible for errors in approved artwork.';
}
function status(text, bad) { const el = $('#status'); if (el) { el.textContent = text; el.className = 'status' + (bad ? ' bad' : ''); } }

window.addEventListener('message', (e) => {
  const m = e.data || {};
  if (m.type === 'init' && m.config && !C) { C = m.config; startDesign = String(m.design || ''); startSize = m.size || null; selectProduct(m.product); }
  if (!C) return;
  if (m.type === 'file') { fileName = m.name || ''; if (cfg) cfg.approved = false; update(); }
  if (m.type === 'status') status(m.text);
  if (m.type === 'added') { addedOnce = true; fileName = ''; cfg.approved = false; update(); status('Added to your cart.'); }
  if (m.type === 'error') { update(); status(m.text, true); }
});
window.addEventListener('resize', () => { if (C) update(); });
send({ type: 'ready' });
</script>
</body>
</html>
